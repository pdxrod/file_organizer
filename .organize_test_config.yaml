min_file_size: 1024
max_file_size: 104857600
enable_content_analysis: false
enable_duplicate_detection: false
enable_folder_sync: true
scan_interval: 3600
idle_backoff_factor: 2
idle_backoff_max_multiplier: 8
flaky_volume_retries: 3
retry_delay: 5
use_rsync: true
rsync_checksum_mode: timestamp
rsync_size_only: false
rsync_whole_file: true
sync_quick_check: true
rsync_binary: ''
sync_failure_cooldown_minutes: 360
sync_failure_state_path: ~/.file_organizer_sync_failures.json
rsync_io_timeout_seconds: 300
rsync_additional_args: []
max_drive_usage_percent: 90
sync_chunk_subfolders: 30
sync_chunk_concurrency: 1
sync_timeout_minutes: 60
sync_lock_enabled: true
sync_lock_stale_minutes: 120
sync_exclude_folder_names:
- file_organizer
- file_organizer_v2
rsync_disable_mmap: true
max_soft_links_per_file: 6
enable_semantic_categories: false
semantic_confidence_threshold: 0.35
ml_content_analysis:
  enabled: false
  min_keyword_frequency: 10
  min_category_size: 5
  max_categories: 1000
  min_word_length: 5
  stop_words_enabled: true
  use_clip: false
auto_git: false
auto_git_folders:
- /Users/rod/dev
collapse_rename_families: false
dedupe_download_copies: true
log_path: ''
pid_path: /tmp/file_organizer.pid
phone_pull:
  auto_pull: true
  local_stage: /Users/rod/misc
  remote_stage: /Users/rod/Library/CloudStorage/ProtonDrive-rodmclaughlin@protonmail.com-folder/misc
  adb_path: /Users/rod/Library/Android/sdk/platform-tools/adb
  temp_stage: /Users/rod/misc/.tmp_pull
  android_base: /storage/emulated/0
  min_age_minutes: 0
  state_file: ''
  phone_source_dirs:
  - file_organizer_staging
  phone_push_dir: file_organizer_staging
  include_extensions: []
  exclude_extensions:
  - .tmp
  - .temp
  - .partial
  - .crdownload
  - .part
  - .download
  - .crypt14
  - .pyc
  - .log
  staging_map: {}
  hold_app_generated_names: true
  normalise_leading_dates: true
softlink_backup_base: ''
softlink_folder_patterns: []
router:
  enabled: true
  action: move
  route_roots:
  - MAIN_DRIVE/misc
  watch_folders:
  - MAIN_DRIVE/Downloads
  - MAIN_DRIVE/Desktop
