    ml_development: ~/dev/ml
    development: ~/dev
    pictures: ~/Pictures
    music: ~/Music
    documents: ~/Documents
    misc: ~/misc
  deepseek:
    enabled: true
    media_enabled: true
    api_key_path: /Users/rod/dev/deepseek-api-key.txt
    model: deepseek-chat
    min_confidence: 0.6
    batch_size: 20
    max_calls_per_run: 150
    max_chars_per_file: 1500
    timeout_seconds: 90
  ocr:
    enabled: true
    budget_per_run: 300
  max_file_size: 262144000
