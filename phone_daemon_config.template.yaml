# Phone Daemon Configuration — TEMPLATE
# =======================================
# Copy this file to phone_daemon_config.yaml and edit for your device:
#   cp phone_daemon_config.template.yaml phone_daemon_config.yaml
#
# The live phone_daemon_config.yaml is git-ignored, so per-device settings
# never conflict with git pull.
#
# This daemon monitors source directories on your phone and copies new files
# to a staging folder on shared storage. It runs on Android via Termux, or on macOS.

# ── Source directories to monitor ────────────────────────────────────────────
# On Android, these are under /storage/emulated/0/
# On macOS, use absolute paths like /Users/rod/...
#
# Missing directories are skipped silently at scan time, so it is safe to
# keep a generous list — the daemon only scans folders that actually exist.
#
# Note: the Files app's "Images" is a virtual MediaStore collection, not a
# real folder. The physical folders behind it are listed below.
source_directories:
  # ── Core Android folders (the four roots of your renamed files) ──
  # DCIM covers Camera AND (on Samsung) DCIM/Screenshots.
  - "/storage/emulated/0/DCIM"
  # Pictures covers Pictures/Screenshots on devices that put them there.
  - "/storage/emulated/0/Pictures"
  - "/storage/emulated/0/Documents"
  - "/storage/emulated/0/Download"
  # Optional extras — uncomment if you want them:
  # - "/storage/emulated/0/Movies"
  # - "/storage/emulated/0/Music"
  # - "/storage/emulated/0/WhatsApp/Media"
  # - "/storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media"
  # - "/storage/emulated/0/Telegram/Telegram Images"
  # - "/storage/emulated/0/Android/media/jp.naver.line.android"
  # Android/data app folders are readable on Android 10 and older only:
  # - "/storage/emulated/0/Android/data/jp.naver.line.android/storage"
  # - "/storage/emulated/0/Android/data/org.telegram.messenger"
  #
  # macOS example:
  # - "/Users/rod/Desktop"
  # - "/Users/rod/Downloads"

# ── Target staging folder ────────────────────────────────────────────────────
# Files are copied here, preserving relative folder structure.
#
# On Android: Proton Drive's app has NO continuously-synced local folder, so
# files are staged on shared storage and the Mac pulls them later via
# phone_pull.sh (USB or wireless debugging) and uploads to Proton Drive.
#
# IMPORTANT: the staging folder must NOT be inside any source_directories
# below (DCIM/Pictures/Documents/Download), or the daemon would re-copy its
# own output every scan.
#
# On macOS (running the daemon on the Mac itself):
#   /Users/YOURNAME/Library/CloudStorage/ProtonDrive-.../My Files/misc
#
# TIP: Run `python3 phone_daemon.py --find-proton` to locate Proton Drive
# folders (mainly useful on macOS).
target_directory: "/storage/emulated/0/file_organizer_staging"

# ── Proton Drive candidate paths ─────────────────────────────────────────────
# Where to look for the Proton Drive folder (`--find-proton` checks these).
# Wildcards like * are allowed. Add your own paths here if Proton Drive
# lives somewhere unusual; the built-in defaults are used for any paths
# you don't override.
proton_drive_paths:
  # macOS
  - "~/Library/CloudStorage/ProtonDrive-*"
  # Android — shared storage
  - "/storage/emulated/0/ProtonDrive"
  - "/storage/emulated/0/Proton Drive"
  - "/storage/emulated/0/Documents/ProtonDrive"
  - "/storage/emulated/0/Download/ProtonDrive"
  # Android — app media (scoped storage)
  - "/storage/emulated/0/Android/media/com.protontech.android.drive"
  # Android — app data (may need root)
  - "/storage/emulated/0/Android/data/com.protontech.android.drive/files"
  # Termux shared
  - "~/storage/shared/ProtonDrive"
  - "~/storage/shared/Proton Drive"

# ── Grace period (minutes) ───────────────────────────────────────────────────
# Files must be at least this old before the daemon will copy them.
# This gives you time to delete unwanted photos BEFORE they get backed up
# — solving the Proton Drive "too eager" backup problem.
#
# Set to 0 to copy immediately. Recommended: 5-10 minutes.
min_age_minutes: 10

# ── Scan interval (seconds) ──────────────────────────────────────────────────
# How often the daemon checks for new files.
# Shorter = more responsive but uses more battery.
# Recommended: 60-300 seconds on phone (300 saves battery), 30-60 on desktop.
scan_interval_seconds: 300

# ── Maximum file size (MB) ───────────────────────────────────────────────────
# Files larger than this are skipped. 0 = no limit.
max_file_size_mb: 500

# ── Extension filters ────────────────────────────────────────────────────────
# include_extensions: if non-empty, ONLY these extensions are copied.
#   Example: [".jpg", ".png", ".pdf", ".txt", ".mp4", ".3gp"]
#
# exclude_extensions: these are NEVER copied (temporary/download-partial and
# junk files). The built-in safety defaults (.tmp, .crypt14, .pyc, .log, …)
# are always in force — your entries only ADD to them.
#
# Both lists are case-insensitive. Leave include_extensions empty to copy ALL types.
include_extensions: []
exclude_extensions:
  - ".tmp"
  - ".temp"
  - ".partial"
  - ".crdownload"
  - ".part"
  - ".download"
  - ".crypt14"
  - ".pyc"
  - ".log"

# ── Exclude patterns ─────────────────────────────────────────────────────────
# Files or folders whose name contains any of these patterns are skipped.
# Case-insensitive substring match. Useful for thumbnails, caches, etc.
# The built-in safety defaults (.thumbnails, .DS_Store, …) are always in
# force — your entries only ADD to them.
exclude_patterns:
  - ".thumbnails"
  - ".thumbdata"
  - ".face"
  - ".pending"
  - ".trashed"
  - ".trash"
  - "thumbdata"
  - ".cache"
  - ".tmp"
  - ".DS_Store"
  - ".Spotlight-V100"
  - ".TemporaryItems"
  - ".fseventsd"
  - ".DocumentRevisions-V100"

# ── Exclude folder names (exact match) ──────────────────────────────────────
# Folders whose name EXACTLY matches one of these patterns are never copied —
# neither their contents nor files in them. Unlike exclude_patterns above,
# this is an exact match, so "build" skips a folder called "build" but NOT
# one called "mybuildings". Matched case-insensitively against the folder
# name and its path (so "priv/static" and "tmp/cache" work).
# The built-in safety defaults (.git, .venv, node_modules, …) are always in
# force — your entries only ADD to them.
exclude_folder_names:
  # Version control — back these up with git push, never file sync
  - ".git"
  - ".hg"
  - ".svn"
  - ".cvs"
  # Environments and dependencies — recreate from lock files
  - ".venv"
  - "venv"
  - "env"
  - ".env"
  - "node_modules"
  - ".next"
  - ".nuxt"
  # Build output and caches
  - "__pycache__"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".tox"
  - ".cache"
  - ".parcel-cache"
  - "coverage"
  - ".nyc_output"
  - "elm-stuff"
  - ".elixir_ls"
  - ".stack-work"
  - "_build"
  - "deps"
  - "ebin"
  - "dist"
  - "build"
  - "target"
  - ".bundle"
  - "vendor"
  - "bundle"
  - "priv/static"
  - ".gradle"
  - ".m2"
  - "tmp/cache"

# ── Exclude folder patterns (folder NAMES only) ───────────────────────────────
# Whole folders whose NAME contains any of these patterns are skipped —
# but FILES with these words in their names are still copied. This is how
# messenger folders (LINE, Twitter, etc.) are excluded without losing a
# file like airline-ticket.pdf. Case-insensitive substring match.
exclude_folder_patterns:
  - "line"
  - "twitter"
  - "gmail"
  - "whatsapp"
  - "telegram"

# ── Delete after copy? ───────────────────────────────────────────────────────
# DANGER: If true, the daemon DELETES the original file after copying.
# This keeps your phone clean but you lose the original. 
# Strongly recommended: keep this FALSE.
delete_after_copy: false

# ── Database path ────────────────────────────────────────────────────────────
# SQLite database tracking which files have already been synced.
# Uses content hashing so renames don't trigger re-copies.
db_path: "~/.phone_daemon.db"

# ── Prune stale entries after N days ────────────────────────────────────────
# If a source file has been deleted for at least this many days, its DB entry
# and its staged copy are removed so deleted files never get backed up.
prune_max_age_days: 30

# ── Log path ─────────────────────────────────────────────────────────────────
log_path: "~/.phone_daemon.log"

# ── PID file path ────────────────────────────────────────────────────────────
pid_path: "~/.phone_daemon.pid"
